<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Support Center</title>

    <style>

        /* ==============================
           RESET
        ============================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* ==============================
           PAGE
        ============================== */

        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

            overscroll-behavior: none;

            background: #090b12;
        }


        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 12px;

            background:

                radial-gradient(
                    circle at top left,
                    rgba(91, 33, 182, 0.35),
                    transparent 35%
                ),

                radial-gradient(
                    circle at bottom right,
                    rgba(16, 185, 129, 0.25),
                    transparent 35%
                ),

                #090b12;
        }


        /* ==============================
           FIXED VIEWPORT
        ============================== */

        .viewport {

            width: 100%;
            height: 100%;

            max-width: 520px;
            max-height: 900px;

            position: relative;

            overflow: hidden;

            border-radius: 30px;
        }


        /* ==============================
           INTERNAL SCROLL AREA
        ============================== */

        .scroll-area {

            width: 100%;
            height: 100%;

            overflow: auto;

            overscroll-behavior: contain;

            -webkit-overflow-scrolling: touch;

            padding: 15px;

            scrollbar-width: thin;

            scrollbar-color:
                rgba(255,255,255,0.35)
                rgba(255,255,255,0.07);
        }


        /* ==============================
           CHROME / ANDROID SCROLLBAR
        ============================== */

        .scroll-area::-webkit-scrollbar {

            width: 7px;
            height: 7px;
        }


        .scroll-area::-webkit-scrollbar-track {

            background:
                rgba(255,255,255,0.07);

            border-radius: 20px;
        }


        .scroll-area::-webkit-scrollbar-thumb {

            background:
                rgba(255,255,255,0.35);

            border-radius: 20px;
        }


        .scroll-area::-webkit-scrollbar-thumb:hover {

            background:
                rgba(255,255,255,0.55);
        }


        /* ==============================
           DECORATIVE GLOW
        ============================== */

        .glow {

            position: fixed;

            width: 180px;
            height: 180px;

            border-radius: 50%;

            filter: blur(70px);

            opacity: 0.35;

            pointer-events: none;
        }


        .glow.one {

            background: #7c3aed;

            top: -70px;
            left: -70px;
        }


        .glow.two {

            background: #10b981;

            bottom: -70px;
            right: -70px;
        }


        /* ==============================
           MAIN CARD
        ============================== */

        .card {

            width: 100%;

            min-height: 100%;

            position: relative;

            background:
                rgba(20,23,34,0.84);

            border:
                1px solid
                rgba(255,255,255,0.09);

            border-radius: 28px;

            padding:
                36px
                25px
                30px;

            text-align: center;

            backdrop-filter: blur(22px);

            -webkit-backdrop-filter: blur(22px);

            box-shadow:

                0 30px 80px
                rgba(0,0,0,0.45),

                inset 0 1px 0
                rgba(255,255,255,0.06);
        }


        /* ==============================
           LOGO
        ============================== */

        .logo {

            width: 78px;
            height: 78px;

            margin:
                0 auto 21px;

            border-radius: 24px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    145deg,
                    #7c3aed,
                    #4f46e5
                );

            box-shadow:

                0 15px 35px
                rgba(124,58,237,0.35),

                inset 0 1px 1px
                rgba(255,255,255,0.25);
        }


        .logo svg {

            width: 38px;
            height: 38px;

            fill: white;
        }


        /* ==============================
           STATUS BADGE
        ============================== */

        .badge {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            padding:
                7px
                12px;

            border-radius: 100px;

            background:
                rgba(255,255,255,0.06);

            border:
                1px solid
                rgba(255,255,255,0.08);

            color: #b9c0d0;

            font-size: 12px;

            font-weight: 600;

            letter-spacing: .3px;

            margin-bottom: 15px;
        }


        .status-dot {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #22c55e;

            box-shadow:
                0 0 12px #22c55e;
        }


        /* ==============================
           HEADING
        ============================== */

        h1 {

            font-size: 31px;

            line-height: 1.15;

            letter-spacing: -1px;

            margin-bottom: 13px;
        }


        /* ==============================
           DESCRIPTION
        ============================== */

        .subtitle {

            color: #9ca3b5;

            font-size: 15px;

            line-height: 1.65;

            max-width: 350px;

            margin:
                0 auto 28px;
        }


        /* ==============================
           SUPPORT BOX
        ============================== */

        .support-box {

            text-align: left;

            padding: 17px;

            border-radius: 20px;

            background:
                rgba(255,255,255,0.045);

            border:
                1px solid
                rgba(255,255,255,0.07);

            margin-bottom: 18px;
        }


        .support-box-title {

            font-size: 12px;

            color: #858da0;

            margin-bottom: 9px;

            font-weight: 700;

            letter-spacing: .5px;
        }


        /* ==============================
           NUMBER ROW
        ============================== */

        .number-row {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;
        }


        .phone {

            font-size: 16px;

            font-weight: 700;

            letter-spacing: .2px;

            white-space: nowrap;

            color: #ffffff;
        }


        /* ==============================
           COPY BUTTON
        ============================== */

        .copy-btn {

            flex-shrink: 0;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 6px;

            border:
                1px solid
                rgba(255,255,255,0.10);

            background:
                rgba(255,255,255,0.07);

            color: #d9deea;

            padding:
                9px
                12px;

            border-radius: 11px;

            font-size: 12px;

            font-weight: 700;

            cursor: pointer;

            transition:
                background .2s ease,
                transform .15s ease;

            -webkit-tap-highlight-color:
                transparent;
        }


        .copy-btn svg {

            width: 15px;
            height: 15px;

            fill: currentColor;
        }


        .copy-btn:active {

            transform:
                scale(.94);
        }


        .copy-btn.copied {

            background:
                rgba(34,197,94,0.14);

            border-color:
                rgba(34,197,94,0.25);

            color: #4ade80;
        }


        /* ==============================
           WHATSAPP BUTTON
        ============================== */

        .whatsapp-btn {

            width: 100%;

            border: none;

            cursor: pointer;

            padding:
                17px
                20px;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #25D366,
                    #16b957
                );

            color: white;

            font-size: 16px;

            font-weight: 800;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 11px;

            box-shadow:

                0 12px 30px
                rgba(37,211,102,0.24),

                inset 0 1px 0
                rgba(255,255,255,0.25);

            transition:
                transform .18s ease,
                box-shadow .18s ease;

            -webkit-tap-highlight-color:
                transparent;
        }


        .whatsapp-btn:active {

            transform:
                scale(.97);

            box-shadow:
                0 7px 18px
                rgba(37,211,102,0.18);
        }


        .whatsapp-icon {

            width: 25px;
            height: 25px;

            fill: white;
        }


        /* ==============================
           HINT
        ============================== */

        .hint {

            color: #72798a;

            font-size: 11px;

            margin-top: 15px;

            line-height: 1.5;
        }


        /* ==============================
           DIVIDER
        ============================== */

        .divider {

            height: 1px;

            background:
                rgba(255,255,255,0.07);

            margin:
                25px
                0
                19px;
        }


        /* ==============================
           FOOTER
        ============================== */

        .footer {

            color: #606778;

            font-size: 11px;

            padding-bottom: 8px;

            line-height: 1.6;
        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 380px) {

            body {

                padding: 7px;
            }


            .scroll-area {

                padding: 9px;
            }


            .card {

                padding:
                    28px
                    18px
                    25px;
            }


            h1 {

                font-size: 27px;
            }


            .phone {

                font-size: 14px;
            }


            .copy-btn {

                padding:
                    8px
                    10px;
            }
        }


        /* ==============================
           SHORT SCREENS
        ============================== */

        @media (max-height: 650px) {

            .card {

                padding-top: 24px;
            }


            .logo {

                width: 64px;
                height: 64px;

                margin-bottom: 15px;
            }


            .logo svg {

                width: 31px;
                height: 31px;
            }


            h1 {

                font-size: 26px;
            }
        }

    </style>

</head>

    <script>

        /* =================================
           WHATSAPP
        ================================= */

        function openWhatsApp() {

            const phone =
                "447882775233";

            const message =
                "Hello Support, I need help with the app.";

            const encodedMessage =
                encodeURIComponent(message);

            const whatsappUrl =
                "https://wa.me/" +
                phone +
                "?text=" +
                encodedMessage;


            /*
             * WhatsApp universal link.
             *
             * If WhatsApp is installed,
             * Android normally opens it.
             */

            window.location.href =
                whatsappUrl;
        }



        /* =================================
           COPY PHONE NUMBER
        ================================= */

        function copyNumber() {

            const number =
                "+44 7882 775233";

            const button =
                document.getElementById(
                    "copyButton"
                );

            const buttonText =
                button.querySelector("span");


            /*
             * Modern clipboard API
             */

            if (
                navigator.clipboard &&
                window.isSecureContext
            ) {

                navigator.clipboard
                    .writeText(number)
                    .then(function () {

                        showCopied();

                    })
                    .catch(function () {

                        fallbackCopy(number);

                    });

            } else {

                /*
                 * Android WebView fallback
                 */

                fallbackCopy(number);
            }



            function fallbackCopy(text) {

                const textarea =
                    document.createElement(
                        "textarea"
                    );

                textarea.value = text;

                textarea.style.position =
                    "fixed";

                textarea.style.left =
                    "-9999px";

                textarea.style.top =
                    "0";

                textarea.style.opacity =
                    "0";

                document.body.appendChild(
                    textarea
                );

                textarea.focus();

                textarea.select();

                try {

                    document.execCommand(
                        "copy"
                    );

                    showCopied();

                } catch (error) {

                    alert(
                        "Unable to copy the number."
                    );

                }

                document.body.removeChild(
                    textarea
                );
            }



            function showCopied() {

                button.classList.add(
                    "copied"
                );

                buttonText.textContent =
                    "Copied";

                setTimeout(function () {

                    button.classList.remove(
                        "copied"
                    );

                    buttonText.textContent =
                        "Copy";

                }, 1800);
            }

        }
